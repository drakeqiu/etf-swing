---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download supplier wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download deps-v1 \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --dir wheels
          ls -lh wheels/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Generate backtesting.py stubs
        run: uv run stubgen -p backtesting -o stubs

      - name: Generate AmazingData stubs
        run: |
          uv run stubgen \
            -m AmazingData \
            -m AmazingData.login.tgw_login \
            -m AmazingData.query_api.base_data \
            -m AmazingData.query_api.market_data \
            -o stubs

      - name: Pyright
        run: uv run pyright

      - name: Mypy
        run: uv run mypy

      - name: YAML lint
        run: uv run yamllint --strict .github

      - name: Tests
        run: uv run pytest
