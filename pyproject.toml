[project]
name = "etf-swing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yuan", email = "adidasqiu@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "backtesting>=0.6.5",
    "tgw==1.0.9.2",
    "AmazingData==1.1.17",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.scripts]
etf-swing = "etf_swing:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "ruff>=0.11.0",
  "yamllint>=1.37.1",
  "basedpyright>=1.29.1"
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
tgw = { path = "wheels/tgw-1.0.9.2-py3-none-any.whl" }
AmazingData = { path = "wheels/AmazingData-1.1.17-cp314-none-any.whl" }

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]